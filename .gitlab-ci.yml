stages:
  - build
  - test
  - code-quality
  - deploy

variables:
  SONAR_HOST_URL: "http://host.docker.internal:9000"
  SONAR_TOKEN: "sqp_3f7a584f0d9b2f4ddbf20ecfb981617fb3ba3dc9"

build:
  stage: build
  image: node:18
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/

test:
  stage: test
  image: node:18
  script:
    - npm install
    - npm test -- --watchAll=false --passWithNoTests

sonarqube-analysis:
  stage: code-quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=ic-generator -Dsonar.sources=src -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
  allow_failure: true

deploy:
  stage: deploy
  image: node:18
  script:
    - npm install
    - npm run build
    - echo "Build successful - ready for deployment"
    - ls build/
  artifacts:
    paths:
      - build/
  only:
    - master